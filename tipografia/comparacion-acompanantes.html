<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:3000px;height:1700px;overflow:hidden;background:#EDE7D6;color:#2B2420}
svg.bg{position:absolute;inset:0}
.col{position:absolute;top:0;width:1000px;height:1700px;box-sizing:border-box;padding:0 120px}
.col+.col{border-left:1.5px solid rgba(43,36,32,.18)}
.tag{position:absolute;top:120px;left:120px;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:#6b5d4c}
.name{position:absolute;top:165px;left:120px;font-size:64px}
.title{position:absolute;top:330px;left:120px;width:760px;height:230px}
.body{position:absolute;top:640px;left:120px;width:760px;font-size:34px;line-height:1.6}
.quote{position:absolute;top:1010px;left:120px;width:760px;font-size:52px;line-height:1.25;font-style:italic}
.meta{position:absolute;top:1240px;left:120px;width:760px;font-size:23px;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;border-top:1.5px solid rgba(43,36,32,.35);padding-top:34px}
.verdict{position:absolute;top:1420px;left:120px;width:760px;font-size:28px;line-height:1.5;color:#6b5d4c}
.gs{font-family:'Google Sans'}.al{font-family:'Alegreya Sans'}.sp{font-family:'Spectral';font-weight:300}
.sp .name{font-weight:400}.al .body{font-size:38px}.al .quote{font-size:56px}
</style></head><body>
<svg class="bg" width="3000" height="1700"><defs>
<filter id="fleck"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="12"/><feColorMatrix type="matrix" values="0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .2  -40 0 0 0 9.0"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/></filter></defs>
<rect width="3000" height="1700" filter="url(#fleck)" opacity=".28"/></svg>
<div id="cols"></div>
<script src="lettering.js"></script>
<script>
const F=[['gs','Opción A','Google Sans','Moderna y amable, pero muy asociada a Google y a la tecnología. Junto a Raíz (también sin remates) hay poco contraste: puede sentirse como una app.'],
['al','Opción B','Alegreya Sans','Sin remates, pero humanista y caligráfica: tiene trazo de pluma. Conversa con lo hecho a mano de Raíz y es poco común en marcas wellness.'],
['sp','Opción C','Spectral','Serif fina y editorial, distinta a Cormorant y poco usada. Máximo contraste con Raíz: la sensación más luxury de las tres.']];
const cols=document.getElementById('cols');
F.forEach(([c,tag,name,verdict],i)=>{
 const d=document.createElement('div');d.className='col '+c;d.style.left=(i*1000)+'px';
 d.innerHTML=`<div class="tag">${tag}</div><div class="name">${name}</div>
 <svg class="title" width="760" height="230"></svg>
 <div class="body">Un espacio para volver a mirarte con ternura. A través de la meditación, el arte y la naturaleza, reconectamos con el niño que fuimos para sanar, soltar y volver a casa.</div>
 <div class="quote">“Volver a ti es volver a casa.”</div>
 <div class="meta">Coloreando Corazones · Oriente Antioqueño</div>
 <div class="verdict">${verdict}</div>`;
 cols.appendChild(d);
 const sv=d.querySelector('svg.title'), o={track:40};
 const cap=760/measureRaiz('NIÑO INTERIOR',Object.assign({cap:100},o))*100;
 drawRaiz(sv,'SANACIÓN DEL',Object.assign({},o,{cap,x:0,y:cap+20,color:'#2B2420',seed:41}));
 drawRaiz(sv,'NIÑO INTERIOR',Object.assign({},o,{cap,x:0,y:cap*2.72+20,color:'#2B2420',seed:42}));
});
const b=document.querySelector('svg.bg');const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
[['width',3000],['height',1700],['filter','url(#paper)'],['opacity',.12],['style','mix-blend-mode:multiply;pointer-events:none']].forEach(([k,v])=>r.setAttribute(k,v));
document.body.appendChild(Object.assign(document.createElementNS('http://www.w3.org/2000/svg','svg'),{})).outerHTML='<svg style="position:absolute;inset:0;pointer-events:none" width="3000" height="1700"><rect width="3000" height="1700" filter="url(#paper)" opacity=".12" style="mix-blend-mode:multiply"/></svg>';
</script></body></html>
