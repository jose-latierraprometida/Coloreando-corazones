<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:3000px;height:1000px;overflow:hidden;background:#EDE7D6}svg{position:absolute;inset:0}</style></head><body>
<svg id="s" width="3000" height="1000"><defs>
 <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#5a4a30" stop-opacity=".16"/></radialGradient>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
 <filter id="cloud"><feTurbulence type="fractalNoise" baseFrequency=".004" numOctaves="4" seed="8"/><feColorMatrix type="saturate" values="0"/></filter>
 <filter id="fleck"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="12"/><feColorMatrix type="matrix" values="0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .2  -40 0 0 0 9.0"/></filter>
</defs>
<rect width="3000" height="1000" fill="#EDE7D6"/>
<rect width="3000" height="1000" filter="url(#cloud)" opacity=".10" style="mix-blend-mode:multiply"/>
<rect width="3000" height="1000" filter="url(#fleck)" opacity=".28"/>
</svg>
<script src="../tipografia/lettering.js"></script>
<script>
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg',INK='#2B2420';
const mk=(n,a,parent)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(parent||s).appendChild(e);return e;};
// Sol entintado a mano
const fid=inkFilter(s,90,INK,{seed:17});
const sun=mk('g',{filter:`url(#${fid})`});
mk('circle',{cx:1500,cy:128,r:30,fill:'none',stroke:'#000','stroke-width':9},sun);
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r1=50,r2=i%2?66:78;
 mk('line',{x1:1500+Math.cos(a)*r1,y1:128+Math.sin(a)*r1,x2:1500+Math.cos(a)*r2,y2:128+Math.sin(a)*r2,stroke:'#000','stroke-width':6.5,'stroke-linecap':'round'},sun);}
// Textos
const rw=drawRaiz(s,'RETIRO',{x:1500,y:282,cap:34,color:INK,track:70,weight:15,seed:2,align:'center'});
const lines=mk('g',{opacity:.75});
mk('line',{x1:1500-rw/2-170,y1:266,x2:1500-rw/2-50,y2:266,stroke:'#000','stroke-width':2.2},lines);
mk('line',{x1:1500+rw/2+50,y1:266,x2:1500+rw/2+170,y2:266,stroke:'#000','stroke-width':2.2},lines);
drawRaiz(s,'SANACIÓN DEL',{x:1500,y:498,cap:132,color:INK,track:44,seed:41,align:'center'});
drawRaiz(s,'NIÑO INTERIOR',{x:1500,y:498+132*1.72,cap:132,color:INK,track:44,seed:42,align:'center'});
const bw=drawRaiz(s,'BY COLOREANDO CORAZONES',{x:1500,y:860,cap:30,color:INK,track:56,weight:15,seed:5,align:'center'});
// pequeños puntos de tinta flanqueando la firma
const df=inkFilter(s,60,INK,{seed:29}); const dots=mk('g',{filter:`url(#${df})`});
mk('circle',{cx:1500-bw/2-60,cy:845,r:5.5,fill:'#000'},dots); mk('circle',{cx:1500+bw/2+60,cy:845,r:5.5,fill:'#000'},dots);
drawRaiz(s,'ORIENTE ANTIOQUEÑO',{x:1500,y:922,cap:22,color:'#6b5d4c',track:60,weight:15,seed:6,align:'center'});
mk('rect',{width:3000,height:1000,filter:'url(#paper)',opacity:.14,style:'mix-blend-mode:multiply'});
mk('rect',{width:3000,height:1000,fill:'url(#vig)'});
</script></body></html>
